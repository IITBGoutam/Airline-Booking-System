worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # Basic rate limiting at the edge — a gateway responsibility.
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;

  upstream auth_upstream    { server auth-service:3001; }
  upstream flight_upstream  { server flight-service:3000; }
  upstream booking_upstream { server booking-service:3002; }

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  # Forward the idempotency key through to the booking service.
  proxy_set_header x-idempotency-key $http_x_idempotency_key;

  server {
    listen 80;
    server_name _;

    location = /health {
      default_type application/json;
      return 200 '{"gateway":"nginx","status":"ok"}';
    }

    # Auth service: /api/auth/*  ->  auth-service /api/v1/*
    location /api/auth/ {
      limit_req zone=api_limit burst=100 nodelay;
      proxy_pass http://auth_upstream/api/v1/;
    }

    # Flight service: /api/flights* -> flight-service /api/v1/flights*
    location /api/flights {
      limit_req zone=api_limit burst=100 nodelay;
      proxy_pass http://flight_upstream/api/v1/flights;
    }

    # Booking service: /api/bookings* -> booking-service /api/v1/bookings*
    location /api/bookings {
      limit_req zone=api_limit burst=100 nodelay;
      proxy_pass http://booking_upstream/api/v1/bookings;
    }
  }
}
